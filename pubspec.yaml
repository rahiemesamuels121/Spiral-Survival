name: spiral_pass_play
description: Spiral board game with local pass-and-play and private five-player online rooms.
publish_to: none
version: 1.1.5+9

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.38.2
  shared_preferences: ^2.5.6
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0

dev_dependencies:
  flutter_lints: ^5.0.0
  shared_preferences_platform_interface: ^2.4.1
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/boards/spiral_board_map.json
